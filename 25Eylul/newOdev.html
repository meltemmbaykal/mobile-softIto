<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Başlık Yazımız-->
    <title>Sipariş & Gelir Kokpit Dashboard</title>
    <!--style etiketi arasına css kodları yazılır.-->
    <style>
      /*global değişken tanımlama için kullanılır.Genellikle sık kullandığımız şeyleri yazıyoruz. renkler, yazı tipleri.
      Burada da sık kulalnılan rnkleri ve font tiplerini yazdk. Daha sonra aşağıdaki css kodalrında bunları kullancağız, 
      tekrarı önleyeceğiz. Ayrıca bir renk değişikliğine gideceği zaman ek bir noktadan hepsini güncelleyebileceğiz*/
      :root {
        --bg: #f8f7f4;
        --card: #ffffff;
        --border: #e6e5df;
        --text: #181716;
        --muted: #6b6963;
        --clay: #c85a32;
        --clay-hover: #b04e29;
        --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      /*Burada bütün html elamanlarını seçer. Yazılacak kodda tüm iç dış boşlukları sıfırlamak ve kutu boyutu hesaplamasını sabitledi*/
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /*Ana GÖvde aslında. Web sayfasında kullanıcıya görünen ana alanları ve tüm içeriği kapsayan html etiketi.
      background ile arka plan rengi verilir. Color ile yazı rengi. Font family ile yazı tipi seçilir. 
      Padding ile iç boşluk verilir. 36 üst ve alt iç boşluk. 16 ise sağ ve sol iç boşluğu temsil eder.
      Line height ise satır yüksekliğini belirler. Buradaki 1.5; Yazı boyutunun bir buçuk katı kadar satır yüksekliği vermemizi sağlar.
      */
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        padding: 36px 16px;
        line-height: 1.5;
      }
      /*NoktaClassİsmi htmlda bu sınıf ,smine ait olan yerdeki değişikliği temsil eder.
      max-width ile o classtaki elemanların genişliğin en fazla 960 olmasını sağladı. 
      margin ise dış boşluktur. Budeğerler ile ekranı yatayda tam ortalar. 
        0 piksel üst ve alt dış boşluktur.ikinci değer ise sağ sol boşluktur.Auto ise boşluğu otomatik hesaplayıp eşit olarak boşluk verir.*/
      .kokpit {
        max-width: 960px;
        margin: 0 auto;
      }

      /* Header & KPI */

      /*Sayfanın başlık alanıdır. margin ve paddingi yukarıda açıklamıştım. Ama böyle -bottom yada -top gibi değerler varsa. 
      İç yada dış boluk ne ise onun sadece üstüne, altına gibi sadece belirli yerinden boşluk bırakmayı sağlar. 
      Burada alttan boşluk veriyoruz.
      Border bottomda ise sadece alt kenarına çizgi eklemek için kullanılıyor.
      Buradaki solid düz çizgidir. Dashed, dotted gibi farklı türleri de vardır Çizginin tipini belirler.
      var(--border) ise çizginin rengini belirtler. Burada üstte tanımladığımız border rengini alır
      */
      .header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      /*header__tag ile kodun okunabilirliğini arttırır. Yani bu header altındaki alt tag bileşenidir demektir. 
      yani header ana blok tag ise onun altındaki elamandır.
      text-transform ile metindeki tüm harfleri büyük harfe çevirir.
      font weight ise yazı kalınlığını ayarlar.*/
      .header__tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--clay);
        font-weight: 700;
      }
      /*headerın altındaki title alt bileşenidir.Altındaki özellikleri yukarıda belirtmiştim o sebple tekrarlamayacağım*/
      .header__title {
        font-size: 26px;
        font-weight: 700;
        margin-top: 2px;
      }
      /*grid; ekranı yatay dikey eksende hizalamak için kullanılır.
      grid-template-columns ise yan yana 3 tane 1lik eşit parçaya böler.
      gap ise grid hücrelerinin kendi arasında 14piksellik boşluk bırakır. */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }
      /*buradaki border-radius dış köşelri yuvarlatmak için kullanılır.*/
      .kpi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 18px;
      }
      /*kpi-card span yazımı csste bir alt eleman seçicisidir. 
       Bu kpi-card sınıfına sahip kutunun altında kalan tüm span etiketlerini kapsar ve yazılan css stillerini sadece bu span etiketine uygular.*/
      .kpi-card span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      /**/
      .kpi-card h3 {
        font-size: 22px;
        font-weight: 700;
        font-family: var(--font-mono);
        margin-top: 4px;
      }

      /* Layout */

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      } /*sayfanın mobilde yada tabletlerde nasıl görüneceğini belirler.
      Ekran genişliği 768piksel veya dah küçük olduğunda parantz içindeki cssler çalışır.
      .layout, .kpi-grid ile çoklu seçici olarak kullanılır. Yani parantez içindeki çzellikler her iki sınıfa da aittir.
      masaüstünde 3 sutun şeklinde duran yapı mobilde tek sutun olarak gözükecektir. Böylece sıkışıklık ortadan kalkar.
      */
      @media (max-width: 768px) {
        .layout,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Form & Panel */
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .panel h4 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .field {
        margin-bottom: 12px;
      } /*display block ile yeni bir satıra geçer. Ve tam genişlik kaplar.*/
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      /*field altındaki tüm input ve selectleri kapsar.
      width:100% ile içinde yer aldığı kutu ne kadar genişse eleman da sağdan soldan o alanın tamamını doldurur.
      ekran boyutu yada kapsayıcı boyutu değiştikçe elemanın genişliği de otomatik olarak o kadar esner. Büyür/küçülür.*/
      .field input,
      .field select {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      /*Kullanıcı fareyle tıklama yaptığında yada kalvyeden taba bastığında odaklandığı anı hedefler. 
      outline:none ile varsayılan çerçeve kaldırılır. (Tarayıcılar otomatik tıklama yada üstüne 
      gelindiğinde bir dış çizgi oluşturur.)Altındakilerle yeni renk ve arkaplan oluşturur*/
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--clay);
        background: #fff;
      }
      /*cursor:pointer Fare imleci o elemanın üstüne gelince varsayılan okten el şimgesine döner.*/
      .btn-submit {
        width: 100%;
        background: var(--clay);
        color: #fff;
        border: none;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 6px;
      } /**/
      .btn-submit:hover {
        background: var(--clay-hover);
      }

      /* Liste & Filtre */

      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .order-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /*display:flex ile Esnek bir kutuya dönüştürülür. İçindeki çocuk elemanlar varsyıln olarak yan yana sıralanır.
      justify-content:space-between yapınca; ilk eleman sola en son eleman sağa aralarındaki elemanlar ise eşit bir şekilde dağıtılır.
      align-items:center ise justify content benzeri olarak bu sefer dikeyde ortalar.  */
      .order-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      } /**/
      .order-item h5 {
        font-size: 13px;
        font-weight: 600;
      } /**/
      .order-item p {
        font-size: 12px;
        color: var(--muted);
      }
      /**/
      .meta-box {
        display: flex;
        align-items: center;
        gap: 10px;
      } /**/
      .badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 600;
        background: #fef3c7;
        color: #92400e;
        font-family: var(--font-mono);
      } /**/
      .badge--mobilya {
        background: #e0e7ff;
        color: #3730a3;
      }
      .badge--aydinlatma {
        background: #fef3c7;
        color: #b45309;
      }
      .badge--seramik {
        background: #d1fae5;
        color: #065f46;
      }
      /**/
      .btn-del {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      } /**/
      .btn-del:hover {
        background: #ef4444;
        color: #fff;
        border-color: #ef4444;
      }
    </style>
  </head>
  <body>
    <!--tüm paneli kapsayan ana kutu. Class ile css deki özellikler belirleir.
    id ile class farkı ise; class geneldir.Bir sayfada birden fazla kez verielbilir.Ortak elemanları gruplamak için kullanılır.-->

    <div class="kokpit">
      <!--Sayfanın başlık alanıdır.-->
      <header class="header">
        <span class="header__tag">Sipariş Takip</span>
        <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>
      </header>
      <!--Kartları bir arada tutan ve düzenlemeleri sağlayan ana grid kapsayıcısıdır.-->
      <section class="kpi-grid">
        <!-- Her bir card ve içindeki başlık ve bilgileri içerir. Buradaki bilgiler daha sonra id ile bulunup
         js kodları ile güncellenecektir. Buradaki bilgiler default bilgilerdir.-->
        <div class="kpi-card">
          <span>Kayıtlı Sipariş</span>
          <h3 id="kpiCount">0</h3>
        </div>
        <div class="kpi-card">
          <span>Toplam Sipariş Tutar</span>
          <h3 id="kpiTotal">0 ₺</h3>
        </div>
        <div class="kpi-card">
          <span>Ortalama Ürün Fiyatı</span>
          <h3 id="kpiAvg">0 ₺</h3>
        </div>
      </section>
      <!--form ile listenin yan yana duracağı ana içerik alanı.-->
      <main class="layout">
        <!--Sol taraftaki sipariş ekleme panel kutusudur.-->
        <section class="panel">
          <!--Sol panel başlığı-->
          <h4>Yeni Sipariş Kaydı</h4>
          <!--Form yapısını tanımlar. -->
          <form id="orderForm">
            <div class="field">
              <label for="prodName">Ürün Adı</label>
              <!--Metin girilebilir bir text alanı oluşturuldu. Buradaki id ile daha sonra js kodunda çağırılarak işlem yaptırılacak.
             Varsayılan yazı olarak Sehpa yazılacak. -->
              <input type="text" id="prodName" placeholder="Sehpa" required />
            </div>
            <div class="field">
              <label for="prodCat">Kategori</label>
              <!--Kullanıcının listeden seçim yapabileceği açılır menü oluşturulur. -->
              <select name="prodCat" id="prodCat">
                <!--option value ile seçilebilecek değerler gözükür.Value ile js de gönderilecek arka plan değeri gösterilir.-->
                <option value="Mobilya">Mobilya</option>
                <option value="Aydınlatma">Aydınlatma</option>
                <option value="Mutfak">Mutfak</option>
              </select>
            </div>
            <div class="field">
              <label for="prodPrice">Fiyat</label>
              <!--Buradaki input ise sadece sayı girilir.Value ile içindeki varsayılan değer gönderilir.
              Min ile girilebilecek en küçük değer belirlenir. step ise oklara basıldığında kaçar kaçar artacağını gösterir.
              Required ile bu alanın dolmasının zorunlu olduğu anlamına gelir.-->
              <input
                type="number"
                id="prodPrice"
                value="3250"
                min="100"
                step="50"
                required
              />
            </div>
            <!--Tıklanıldığında formu tetikleyen kaydet butonudur-->
            <button type="submit" class="btn-submit">Siparişi Kaydet</button>
          </form>
        </section>

        <section class="panel">
          <div class="filter-bar">
            <!--bir text alanı oluşturup. Burada bir style belirtilir bu style inline style olarak adlandırılır. 
            Bu style sadece bu inputa özeldir. Ama en yüksek önceliğe sahip css özelliğidir. 
            Yani burayla ilgili yazılan tüm css kodlarını ezer.  -->
            <input
              type="text"
              id="searchInput"
              class="field"
              style="margin-bottom: 0"
              placeholder="Ürün Adına Göre Filtrele"
            />
            <!-- Siparişleri seçilen kategoriye göre süzmek için kullanılan filtre menüsüdür.-->
            <select
              id="categoryFilter"
              style="width: 130px; font-size: 12px; padding: 6px"
            >
              <!-- Kategorileri option  value ile belirleriz. value="ALL" tüm seçenekleri gösterir-->
              <option value="ALL">Tüm Kategoriler</option>
              <option value="Mobilya">Mobilya</option>
              <option value="Aydınlatma">Aydınlatma</option>
              <option value="Mutfak">Mutfak</option>
            </select>
          </div>

          <div id="orderContainer" class="order-list">
            <!--Dinamik olarak elemanlar buraya eklenecek-->
          </div>
        </section>
      </main>
    </div>
    <!--Sipariş verilerini hafızada tutan filtreleyen,dinamik olarak çizen ve istatistikleri anlık hesaplayan paneldir. -->
    <script>
      /*Başlangıçta ekranda görünecek siparişlerin listesini tutar.*/
      let orders = [
        { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
        { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
        { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
        { id: 4, name: "Bulaşık Makinesi", category: "Mutfak", price: 10000 },
        { id: 5, name: "Ocak", category: "Mutfak", price: 15000 },
      ];

      //dom elementleri toplayalım. Html tarafında tanımlanan id değerlerine bağlanır.Bu değerleri değişkenlere atar.
      const orderContainer = document.getElementById("orderContainer");
      const orderForm = document.getElementById("orderForm");
      const searchInput = document.getElementById("searchInput");
      const categoryFilter = document.getElementById("categoryFilter");
      const kpiCount = document.getElementById("kpiCount");
      const kpiTotal = document.getElementById("kpiTotal");
      const kpiAvg = document.getElementById("kpiAvg");

      //istatik hesaplama fonksiyonu.
      const updateKPIs = (dataList) => {
        //kayıtlı sipariş içeriğine. dataList arrayinin uzunluğunu alır.
        kpiCount.textContent = dataList.length;
        //eğer uzunluk 0 ise de toplam ve ortalamyı o olarak yansıtır.
        if (dataList.length === 0) {
          kpiTotal.textContent = "0 ₺";
          kpiAvg.textContent = "0 ₺";
          return;
        }

        //Toplam Tutar (.reduce)
        //buradaki reduce dizi içindeki tüm ürünlerin fiyat değerini üst üste toplayarak toplam tutarı bulur.
        //Sayıyı  türkiye formatında biçimlendirir.Bunu kpiTotal içindeki texte yazar.
        const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
        kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;

        //Ortalama Fİyat (.reduce)
        //yukarıda toplanan değeri liste uzunluğuna böler böylece ortalam belirlenir.
        //MAth.round() ile küsüratlı çıkan değeri en yakın tam sayıya yuvarlar.
        const avg = total / dataList.length;
        kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
      };

      //SİPARİŞ EKLEME
      orderForm.addEventListener("submit", (e) => {
        e.preventDefault(); // Formun sayfayı yenilemesini engeller

        // Form girdilerinden bize lazım olan değerleri aldık
        const nameInput = document.getElementById("prodName");
        const catInput = document.getElementById("prodCat");
        const priceInput = document.getElementById("prodPrice");

        // Yeni sipariş nesnesini oluşturduk. İçine id,name,category ve fyat bilgisini ekledim.
        //id yi unique bir değer olmasını sağladım. MAth.random ile yaptım bunu
        const newOrder = {
          id: "id-" + Math.random().toString(36).substring(2, 9),
          name: nameInput.value.trim(),
          category: catInput.value,
          price: Number(priceInput.value),
        };

        // Yeni siparişi listelediğimiz yere en üste ekledik
        orders.unshift(newOrder);

        // Formu sıfırladım
        orderForm.reset();

        // Ekranı ve KPI'ları güncelledim
        renderOrders();
      });

      //Sipariş SİLME
      orderContainer.addEventListener("click", (e) => {
        // Tıklanan elemanın data-action buton olup olmadığını kontrol edilir
        if (e.target.getAttribute("data-action") === "delete") {
          // Tıklanan butonun bağlı olduğu en yakın 'order-item' kartı
          const orderItem = e.target.closest(".order-item");

          // id'yi string olarak alıyoruz
          const idToDelete = orderItem.getAttribute("data-id");

          // eşleşmeyenleri tutup, eşleşeni silme komutu
          orders = orders.filter((order) => order.id != idToDelete);

          // Ekranı güncelledik
          renderOrders();
        }
      });

      //Filtreleme bölümü (dinamik dom/ Render Motoru)
      //Arama kutusuna yazılan metni alır, büyük küçük harf duyarlılığını kaldırmak için hepsini küçüğe çevirir.
      //trim ile başındaki ve sonundaki boşlukları temizler.
      //categoryFilter.value ile seçilen değeri alır.
      const renderOrders = () => {
        const term = searchInput.value.toLowerCase().trim();
        const selectedCat = categoryFilter.value;

        //.filter ile tüm sipariş listesini tek tek gezer. Ürün adı arama kelimesini içeriyor mu diye bakar
        //Tüm Kategoriler mi seçili VEYA ürünün kategorisi seçilen kategoriyle birebir eşleşiyor mu?
        //Bu iki koşuldan birini sağlıyorsa ürünü filtrelenmiş listeye alır.
        const filtered = orders.filter((order) => {
          const matchesName = order.name.toLowerCase().includes(term);
          const mathesCategory =
            selectedCat === "ALL" || order.category === selectedCat;
          return matchesName && mathesCategory;
        });
        //Listenin içini temizler.
        orderContainer.innerHTML = "";
        // hiçbir ürün eşleşmediyse ekrana uyarı basar ve KPI değerlerini sıfırlamak için updateKPIs çağırılır.
        if (filtered.length === 0) {
          orderContainer.innerHTML = `
            <div style="padding:24px; text-align:center; color:var(--muted); font-size:12px">
                Kriterlere Uygun Ürün Bulunmadı
            </div>
            `;

          updateKPIs([]);
          return;
        }

        //dinamik element üretim
        //item'a order-item css  sınıfını atar.
        //Silme işlemi için benzersiz ürün ıdsini  order.id ile karta veri olarak ekler.
        filtered.forEach((order) => {
          const item = document.createElement("article");
          item.className = "order-item";
          item.setAttribute("data-id", order.id);
          //Hangi kategori hangi rengi alacak onu belirler.
          const badgeClass =
            order.category === "Mobilya"
              ? "badge--mobilya"
              : order.category === "Aydınlatma"
              ? "badge--aydinlatma"
              : "badge--seramik";
          //Oluşturulan kartın içine ürünün adı,fiyatı, badge ve sil butonunu ekler.
          item.innerHTML = `
            <div>
                <h5> ${order.name} </h5>
                <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺ </p>
            </div>

            <div class="meta-box">
                <span class="badge ${badgeClass}">${order.category}</span>
                <button class="btn-del" data-action="delete">Sil </button>
                </div>
                `;
          //Hazırlanan kartı ekrandaki liste kapsayıcısına ekler.Tüm filtrelenmiş listeyi updateKPIs ile gösteririz.
          orderContainer.appendChild(item);
          updateKPIs(filtered);
        });
      };
      //Arama kutusuna her harf yazıldığında/silindiğinde renderOrders fonksiyonunu çalıştırarak anlık filtreleme yapar.
      searchInput.addEventListener("input", renderOrders);
      //Açılır menüden farklı bir kategori seçildiğinde renderOrders fonksiyonunu çalıştırır.
      categoryFilter.addEventListener("change", renderOrders);
      //SAyfa ilk açıldığında renderOrders çalıştırılr. Böylece manuel olarak girdiğimiz 5 ürün ekrana bastırılır.
      renderOrders();
    </script>
  </body>
</html>
