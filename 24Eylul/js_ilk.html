      //Şarj Süresi TAhmin.

      const sarjsuresi = (mevcutYüzde, hedefYüzde, bataryaKw, istasyonKw) => {
        if (hedefYüzde > mevcutYüzde) {
          const alinacakKw = istasyonKw > bataryaKw ? bataryaKw : istasyonKw;
          const ihtiyacOlankWh = ((hedefYüzde - mevcutYüzde) / 100) * bataryaKw;

          const sure = (ihtiyacOlankWh / alinacakKw) * 60;
