      const kozmetikUrunSec = async () => {
        try {
          console.log("Harici Apiye Bağlanılıyor.");
          const response = await fetch("http://dummyjson.com/products");
          if (!response.ok) {
            throw new Error(`Http Hatası: ${response.status}`);
          }

          const data = await response.json();
          console.log("DATA---", data);
          console.log(
            `Toplam ${data.products.length} adet kozmetik ürün çekildi`
          );

          const vitrin = data.products.slice(1, 6).map((p) => ({
            urun: p.title,
            acıklama: p.description,
            kategori: p.category,
            etiketler: p.tags.join(", "),
            fiyat: p.price,
            stok: p.stock,
          }));
          console.table(vitrin);
        } catch (err) {
          console.warn("Api HAtası", err.message);
        }
      };
