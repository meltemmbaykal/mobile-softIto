<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İframe</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        background: khaki;
        padding: 20px;
        max-width: 600px;
        margin: auto;
      }
      .card {
        background-color: blueviolet;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 52px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      h3 {
        margin-top: 0;
        color: #1e293b;
      }
      iframe {
        width: 100%;
        border-radius: 8px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>İframe HArita ve video</h3>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/1yRLRmKDS08?si=_M2dkjVlPfBRhdae"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

      <br />
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d200081.1282624096!2d26.96023015038037!3d38.4121795640005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1str!2str!4v1789995911420!5m2!1str!2str"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </body>
</html>
